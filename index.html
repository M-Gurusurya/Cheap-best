<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1D17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Best Value">

<title>Best Value</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

:root {
    --bg: #0F1D17;
    --bg-2: #14251D;
    --surface: #F5F1E7;
    --surface-2: #EDE8DA;
    --white: #FFFFFF;
    --ink: #14221B;
    --muted: #748078;
    --muted-dark: rgba(245,241,231,.48);

    --yellow: #E9CB52;
    --yellow-dark: #C7A936;
    --orange: #E96643;
    --green: #527A5D;

    --border: rgba(20,34,27,.12);
    --dark-border: rgba(245,241,231,.10);

    --radius: 16px;
    --radius-sm: 10px;

    --shadow:
        0 18px 50px rgba(0,0,0,.20);

    --ease: cubic-bezier(.2,.8,.2,1);

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*,
*::before {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(
            650px 400px at 90% -10%,
            rgba(233,203,82,.13),
            transparent 65%
        ),
        var(--bg);

    color: var(--surface);
    font-family: "DM Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;

    padding-bottom: calc(40px + var(--safe-bottom));
}

/* ---------------- APP HEADER ---------------- */

.app-header {
    position: sticky;
    top: 0;
    z-index: 20;

    padding:
        calc(12px + var(--safe-top))
        16px
        12px;

    background: rgba(15,29,23,.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom: 1px solid var(--dark-border);
}

.header-inner {
    max-width: 560px;
    margin: auto;

    display: flex;
    align-items: center;
    gap: 11px;
}

.logo {
    width: 36px;
    height: 36px;

    border-radius: 11px;

    background: var(--yellow);

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.logo svg {
    width: 20px;
    height: 20px;
}

.brand {
    flex: 1;
}

.brand-name {
    font-family: "Space Grotesk", sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.02em;
}

.brand-sub {
    font-size: 10px;
    color: var(--muted-dark);
    margin-top: 1px;
}

.item-count {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--muted-dark);
}

/* ---------------- MAIN ---------------- */

.container {
    width: min(560px, 100%);
    margin: auto;
    padding: 18px 16px 0;
}

/* ---------------- INPUT CARD ---------------- */

.input-card {
    background: var(--surface);
    color: var(--ink);

    border-radius: 20px;
    padding: 18px;

    box-shadow: var(--shadow);
}

.form-title {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 17px;
}

.form-title strong {
    font-family: "Space Grotesk", sans-serif;
    font-size: 16px;
}

.form-title span {
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
}

/* ---------------- FIELDS ---------------- */

.field {
    margin-bottom: 13px;
}

.field-label {
    display: block;

    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    font-weight: 600;

    text-transform: uppercase;
    letter-spacing: .08em;

    color: var(--muted);

    margin-bottom: 6px;
}

input {
    width: 100%;
    height: 48px;

    border: 1.5px solid var(--border);
    border-radius: 11px;

    background: rgba(255,255,255,.88);
    color: var(--ink);

    padding: 0 13px;

    font-family: "DM Sans", sans-serif;
    font-size: 16px;
    font-weight: 500;

    outline: none;

    transition:
        border-color .18s var(--ease),
        box-shadow .18s var(--ease),
        background .18s var(--ease);
}

input:focus {
    border-color: var(--ink);
    background: var(--white);
    box-shadow: 0 0 0 4px rgba(20,34,27,.06);
}

input::placeholder {
    color: #A8AEA9;
}

/* ---------------- SIZE / UNIT ---------------- */

.size-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 9px;
}

.unit-selector {
    height: 48px;

    display: flex;
    align-items: stretch;

    background: rgba(20,34,27,.06);
    border: 1.5px solid var(--border);

    border-radius: 11px;
    padding: 3px;
}

.unit-option {
    border: none;
    background: transparent;

    color: var(--muted);

    min-width: 51px;

    border-radius: 8px;

    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background .15s var(--ease),
        color .15s var(--ease);
}

.unit-option.active {
    background: var(--ink);
    color: var(--surface);
}

/* ---------------- PRESETS ---------------- */

.presets {
    display: flex;
    gap: 7px;

    overflow-x: auto;
    scrollbar-width: none;

    padding: 1px 1px 3px;
}

.presets::-webkit-scrollbar {
    display: none;
}

.preset {
    flex-shrink: 0;

    height: 32px;
    padding: 0 12px;

    border-radius: 9px;

    border: 1px solid var(--border);
    background: rgba(20,34,27,.035);

    color: var(--ink);

    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 600;

    cursor: pointer;

    transition:
        transform .12s var(--ease),
        background .15s var(--ease),
        border-color .15s var(--ease);
}

.preset:active {
    transform: scale(.94);
}

.preset.active {
    background: var(--yellow);
    border-color: var(--yellow-dark);
}

/* ---------------- PRICE ---------------- */

.price-add-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    align-items: end;
}

.price-wrap {
    position: relative;
}

.currency {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);

    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;

    color: var(--muted);
}

.price-input {
    padding-left: 31px;
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;
}

.add-button {
    width: 100%;
    height: 48px;

    border: none;
    border-radius: 11px;

    background: var(--ink);
    color: var(--surface);

    font-family: "DM Sans", sans-serif;
    font-size: 14px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform .12s var(--ease),
        background .15s var(--ease);
}

.add-button:active {
    transform: scale(.97);
    background: #263A30;
}

/* ---------------- RESULTS HEADER ---------------- */

.results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin: 26px 2px 11px;
}

.results-title {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 600;

    text-transform: uppercase;
    letter-spacing: .1em;

    color: var(--muted-dark);
}

.clear-button {
    border: none;
    background: none;

    color: var(--orange);

    font-family: "JetBrains Mono", monospace;
    font-size: 10px;

    text-decoration: underline;
    text-underline-offset: 3px;

    cursor: pointer;
}

/* ---------------- EMPTY STATE ---------------- */

.empty {
    border: 1px dashed rgba(245,241,231,.16);
    border-radius: 17px;

    padding: 43px 20px;

    text-align: center;

    color: rgba(245,241,231,.42);
}

.empty-icon {
    width: 48px;
    height: 48px;

    margin: auto auto 13px;

    border-radius: 14px;

    background: rgba(245,241,231,.055);

    display: flex;
    align-items: center;
    justify-content: center;
}

.empty-icon svg {
    width: 24px;
    height: 24px;
}

.empty-title {
    font-size: 14px;
    font-weight: 600;

    color: rgba(245,241,231,.58);

    margin-bottom: 4px;
}

.empty-text {
    font-size: 11px;
}

/* ---------------- GROUP ---------------- */

.group {
    margin-bottom: 21px;
}

.group-label {
    display: flex;
    align-items: center;
    gap: 8px;

    margin: 0 2px 8px;

    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    font-weight: 600;

    text-transform: uppercase;
    letter-spacing: .09em;

    color: var(--yellow);
}

.group-label::after {
    content: "";
    height: 1px;
    flex: 1;

    background: rgba(245,241,231,.08);
}

/* ---------------- RESULT CARD ---------------- */

.result-card {
    position: relative;

    background: var(--surface);
    color: var(--ink);

    border-radius: 16px;

    padding: 15px;

    margin-bottom: 9px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.14);

    display: grid;

    grid-template-columns: 1fr auto auto;
    gap: 10px;

    align-items: center;

    animation: cardIn .35s var(--ease) both;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(7px) scale(.985);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.result-card.best {
    background:
        linear-gradient(
            135deg,
            #F8F2D9,
            var(--surface)
        );

    box-shadow:
        0 0 0 1.5px var(--yellow),
        0 12px 30px rgba(0,0,0,.16);
}

.best-label {
    display: inline-flex;
    align-items: center;
    gap: 4px;

    background: var(--yellow);

    color: var(--ink);

    border-radius: 5px;

    padding: 3px 6px;

    margin-bottom: 5px;

    font-family: "JetBrains Mono", monospace;
    font-size: 8px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: .05em;
}

.product-name {
    font-family: "Space Grotesk", sans-serif;

    font-size: 14px;
    font-weight: 700;

    line-height: 1.2;

    overflow-wrap: anywhere;
}

.product-meta {
    margin-top: 4px;

    color: var(--muted);

    font-family: "JetBrains Mono", monospace;
    font-size: 9.5px;
}

.unit-price {
    text-align: right;

    font-family: "Space Grotesk", sans-serif;
    font-size: 18px;
    font-weight: 700;

    line-height: 1;
}

.unit-price small {
    display: block;

    margin-top: 4px;

    color: var(--muted);

    font-family: "JetBrains Mono", monospace;
    font-size: 8px;
    font-weight: 500;

    text-transform: uppercase;
}

.remove {
    width: 28px;
    height: 28px;

    border: none;
    border-radius: 50%;

    background: transparent;

    color: #89918B;

    font-size: 19px;
    line-height: 1;

    cursor: pointer;

    transition:
        background .15s,
        color .15s;
}

.remove:active {
    background: rgba(233,102,67,.12);
    color: var(--orange);
}

.price-bar {
    grid-column: 1 / -1;

    height: 4px;

    background: rgba(20,34,27,.075);

    border-radius: 10px;

    overflow: hidden;

    margin-top: 1px;
}

.price-fill {
    height: 100%;

    border-radius: inherit;

    background: #89968D;

    transition: width .55s var(--ease);
}

.result-card.best .price-fill {
    background: var(--yellow-dark);
}

/* ---------------- SAVINGS ---------------- */

.savings {
    margin: -1px 2px 0;

    padding: 3px 0 0;

    font-family: "JetBrains Mono", monospace;
    font-size: 9.5px;

    line-height: 1.55;

    color: rgba(245,241,231,.55);
}

.savings strong {
    color: var(--yellow);
}

/* ---------------- TABLE ---------------- */

.ranking-section {
    margin-top: 31px;
}

.ranking-title {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 600;

    text-transform: uppercase;
    letter-spacing: .1em;

    color: var(--muted-dark);

    margin: 0 2px 11px;
}

.table-card {
    background: var(--surface);

    border-radius: 16px;

    overflow: hidden;

    box-shadow: var(--shadow);
}

.table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;
    min-width: 430px;

    border-collapse: collapse;

    color: var(--ink);
}

thead th {
    padding: 11px 12px;

    text-align: left;

    border-bottom: 1px solid var(--border);

    font-family: "JetBrains Mono", monospace;
    font-size: 8px;
    font-weight: 600;

    text-transform: uppercase;
    letter-spacing: .07em;

    color: var(--muted);

    white-space: nowrap;
}

tbody tr {
    border-bottom: 1px dashed var(--border);
}

tbody tr:last-child {
    border-bottom: none;
}

tbody tr.best-row {
    background: rgba(233,203,82,.18);
}

td {
    padding: 11px 12px;

    font-size: 11px;
}

td.num {
    text-align: right;
}

.rank {
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    color: var(--muted);
}

.best-row .rank {
    color: var(--yellow-dark);
}

.product-cell {
    font-weight: 600;
}

.unit-cell {
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;

    white-space: nowrap;
}

.badge {
    display: inline-block;

    margin-left: 5px;

    padding: 2px 5px;

    border-radius: 4px;

    background: var(--yellow);

    font-family: "JetBrains Mono", monospace;
    font-size: 7px;
    font-weight: 700;

    text-transform: uppercase;
}

/* ---------------- FOOTER ---------------- */

footer {
    text-align: center;

    margin-top: 35px;
    padding-top: 15px;

    border-top: 1px solid var(--dark-border);

    color: rgba(245,241,231,.25);

    font-family: "JetBrains Mono", monospace;
    font-size: 8px;
}

/* ---------------- DESKTOP ---------------- */

@media (min-width: 600px) {

    .container {
        padding-left: 20px;
        padding-right: 20px;
    }

    .input-card {
        padding: 22px;
    }

}

/* ---------------- INVALID ---------------- */

.invalid {
    animation: shake .3s ease;
    border-color: var(--orange) !important;
}

@keyframes shake {
    0%,100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-4px);
    }

    75% {
        transform: translateX(4px);
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before {
        animation-duration: .001ms !important;
        transition-duration: .001ms !important;
    }
}
</style>
</head>

<body>

<header class="app-header">
    <div class="header-inner">

        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none">
                <path
                    d="M4 9L12 3L20 9V20C20 20.55 19.55 21 19 21H5C4.45 21 4 20.55 4 20V9Z"
                    stroke="#14221B"
                    stroke-width="1.8"
                    stroke-linejoin="round"
                />
                <path
                    d="M8 13H16M8 16H13"
                    stroke="#14221B"
                    stroke-width="1.7"
                    stroke-linecap="round"
                />
            </svg>
        </div>

        <div class="brand">
            <div class="brand-name">Best Value</div>
            <div class="brand-sub">Compare before you buy</div>
        </div>

        <div class="item-count" id="header-count"></div>

    </div>
</header>


<main class="container">

    <!-- INPUT -->

    <section class="input-card">

        <div class="form-title">
            <strong>Add an option</strong>
            <span id="product-number">OPTION A</span>
        </div>


        <div class="field">

            <label class="field-label">
                Product name
            </label>

            <input
                id="f-name"
                type="text"
                autocomplete="off"
                placeholder="e.g. Aashirvaad Atta"
            >

        </div>


        <div class="field">

            <label class="field-label">
                Pack size
            </label>

            <div class="size-row">

                <input
                    id="f-qty"
                    type="number"
                    min="0"
                    step="0.01"
                    inputmode="decimal"
                    placeholder="100"
                >

                <div class="unit-selector" id="unit-selector">

                    <button
                        class="unit-option active"
                        data-unit="g"
                        type="button"
                    >
                        g
                    </button>

                    <button
                        class="unit-option"
                        data-unit="kg"
                        type="button"
                    >
                        kg
                    </button>

                    <button
                        class="unit-option"
                        data-unit="ml"
                        type="button"
                    >
                        ml
                    </button>

                    <button
                        class="unit-option"
                        data-unit="L"
                        type="button"
                    >
                        L
                    </button>

                    <button
                        class="unit-option"
                        data-unit="pcs"
                        type="button"
                    >
                        pcs
                    </button>

                </div>

            </div>

        </div>


        <div class="field">

            <div class="presets" id="presets"></div>

        </div>


        <div class="price-add-row">

            <div>

                <label class="field-label">
                    Price
                </label>

                <div class="price-wrap">

                    <span class="currency">₹</span>

                    <input
                        id="f-price"
                        class="price-input"
                        type="number"
                        min="0"
                        step="0.01"
                        inputmode="decimal"
                        placeholder="0"
                    >

                </div>

            </div>

            <button
                class="add-button"
                id="add-btn"
                type="button"
            >
                + Add option
            </button>

        </div>

    </section>


    <!-- RESULTS HEADER -->

    <div class="results-header">

        <div
            class="results-title"
            id="results-title"
        >
            Your options
        </div>

        <button
            class="clear-button"
            id="clear-btn"
            type="button"
            style="display:none"
        >
            Clear all
        </button>

    </div>


    <!-- RESULTS -->

    <div id="results"></div>


    <!-- RANKING -->

    <section
        class="ranking-section"
        id="table-section"
        style="display:none"
    >

        <div class="ranking-title">
            Full ranking
        </div>

        <div class="table-card">

            <div class="table-scroll">

                <table>

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Product</th>
                            <th>Pack</th>
                            <th class="num">Price</th>
                            <th class="num">Per unit</th>
                        </tr>
                    </thead>

                    <tbody id="table-body"></tbody>

                </table>

            </div>

        </div>

    </section>


    <footer>
        Best Value · simple unit price comparison
    </footer>

</main>


<script>

(function () {

    "use strict";


    /* ---------------- DATA ---------------- */

    const items = [];

    let nextId = 1;
    let productCounter = 0;


    const UNIT_INFO = {

        g: {
            type: "weight",
            toBase: 1,
            label: "g"
        },

        kg: {
            type: "weight",
            toBase: 1000,
            label: "g"
        },

        ml: {
            type: "volume",
            toBase: 1,
            label: "ml"
        },

        L: {
            type: "volume",
            toBase: 1000,
            label: "ml"
        },

        pcs: {
            type: "count",
            toBase: 1,
            label: "piece"
        }

    };


    const PRESETS = {

        g: [50, 100, 150, 200, 250, 500],

        kg: [0.5, 1, 2, 5],

        ml: [100, 150, 250, 500, 750],

        L: [0.5, 1, 1.5, 2],

        pcs: [1, 2, 4, 6, 10, 12]

    };


    const TYPE_ORDER = [
        "weight",
        "volume",
        "count"
    ];


    const TYPE_TITLE = {
        weight: "By weight",
        volume: "By volume",
        count: "By count"
    };


    const moneyFmt = new Intl.NumberFormat(
        "en-IN",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 4
        }
    );


    const fmtMoney = value =>
        "₹" + moneyFmt.format(value);


    /* ---------------- ELEMENTS ---------------- */

    const el = {

        name: document.getElementById("f-name"),

        qty: document.getElementById("f-qty"),

        price: document.getElementById("f-price"),

        add: document.getElementById("add-btn"),

        clear: document.getElementById("clear-btn"),

        results: document.getElementById("results"),

        headerCount:
            document.getElementById("header-count"),

        productNumber:
            document.getElementById("product-number"),

        presets:
            document.getElementById("presets"),

        unitSelector:
            document.getElementById("unit-selector"),

        tableSection:
            document.getElementById("table-section"),

        tableBody:
            document.getElementById("table-body")

    };


    let currentUnit = "g";


    /* ---------------- HELPERS ---------------- */

    function letterLabel(n) {

        let result = "";

        n++;

        while (n > 0) {

            const remainder = (n - 1) % 26;

            result =
                String.fromCharCode(65 + remainder)
                + result;

            n = Math.floor((n - 1) / 26);
        }

        return result;
    }


    function escapeHtml(value) {

        return String(value).replace(
            /[&<>"']/g,
            char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char])
        );

    }


    /* ---------------- DEFAULTS ---------------- */

    function setDefaults() {

        el.name.value =
            "Product " + letterLabel(productCounter);

        el.qty.value =
            currentUnit === "g"
                ? "100"
                : "";

        el.price.value = "";

        updateProductNumber();

        renderPresets();

    }


    function updateProductNumber() {

        el.productNumber.textContent =
            "OPTION " + letterLabel(productCounter);

    }


    /* ---------------- UNITS ---------------- */

    el.unitSelector.addEventListener(
        "click",
        event => {

            const button =
                event.target.closest(".unit-option");

            if (!button) return;

            currentUnit =
                button.dataset.unit;

            el.unitSelector
                .querySelectorAll(".unit-option")
                .forEach(option => {

                    option.classList.toggle(
                        "active",
                        option === button
                    );

                });

            el.qty.value = "";

            renderPresets();

        }
    );


    /* ---------------- PRESETS ---------------- */

    function renderPresets() {

        const values =
            PRESETS[currentUnit] || [];

        el.presets.innerHTML =
            values.map(value => `

                <button
                    type="button"
                    class="preset"
                    data-value="${value}"
                >
                    ${value}${currentUnit}
                </button>

            `).join("");

        syncPreset();

    }


    function syncPreset() {

        const value = el.qty.value;

        el.presets
            .querySelectorAll(".preset")
            .forEach(button => {

                button.classList.toggle(
                    "active",
                    button.dataset.value === value
                );

            });

    }


    el.presets.addEventListener(
        "click",
        event => {

            const button =
                event.target.closest(".preset");

            if (!button) return;

            el.qty.value =
                button.dataset.value;

            syncPreset();

        }
    );


    el.qty.addEventListener(
        "input",
        syncPreset
    );


    /* ---------------- VALIDATION ---------------- */

    function invalid(input) {

        input.classList.remove("invalid");

        void input.offsetWidth;

        input.classList.add("invalid");

        input.focus();

        setTimeout(() => {

            input.classList.remove("invalid");

        }, 400);

    }


    /* ---------------- ADD ITEM ---------------- */

    function addItem() {

        const name =
            el.name.value.trim()
            ||
            "Product " + letterLabel(productCounter);

        const qty =
            parseFloat(el.qty.value);

        const price =
            parseFloat(el.price.value);

        if (!(qty > 0)) {

            invalid(el.qty);

            return;

        }

        if (!(price > 0)) {

            invalid(el.price);

            return;

        }


        const info =
            UNIT_INFO[currentUnit];

        const baseQty =
            qty * info.toBase;


        items.push({

            id: nextId++,

            name,

            qty,

            unit: currentUnit,

            price,

            type: info.type,

            label: info.label,

            unitPrice:
                price / baseQty

        });


        productCounter++;

        setDefaults();

        render();

    }


    /* ---------------- REMOVE ---------------- */

    function removeItem(id) {

        const index =
            items.findIndex(item =>
                item.id === id
            );

        if (index !== -1) {

            items.splice(index, 1);

        }

        render();

    }


    el.results.addEventListener(
        "click",
        event => {

            const button =
                event.target.closest("[data-remove]");

            if (!button) return;

            removeItem(
                Number(button.dataset.remove)
            );

        }
    );


    /* ---------------- TICKET ---------------- */

    function buildTicket(
        item,
        best,
        maxPrice
    ) {

        const percentage =
            maxPrice > 0
                ? Math.max(
                    5,
                    item.unitPrice / maxPrice * 100
                )
                : 100;


        return `

            <article
                class="result-card ${best ? "best" : ""}"
            >

                <div>

                    ${
                        best
                            ? `
                                <div class="best-label">
                                    ★ Best value
                                </div>
                            `
                            : ""
                    }

                    <div class="product-name">
                        ${escapeHtml(item.name)}
                    </div>

                    <div class="product-meta">
                        ${fmtMoney(item.price)}
                        ·
                        ${item.qty} ${item.unit}
                    </div>

                </div>


                <div class="unit-price">

                    ${fmtMoney(item.unitPrice)}

                    <small>
                        / ${item.label}
                    </small>

                </div>


                <button
                    class="remove"
                    data-remove="${item.id}"
                    aria-label="Remove ${escapeHtml(item.name)}"
                >
                    ×
                </button>


                <div class="price-bar">

                    <div
                        class="price-fill"
                        style="width:${percentage.toFixed(1)}%"
                    ></div>

                </div>

            </article>

        `;

    }


    /* ---------------- TABLE ---------------- */

    function buildRow(
        item,
        rank,
        best
    ) {

        return `

            <tr class="${best ? "best-row" : ""}">

                <td class="rank">
                    #${rank}
                </td>

                <td class="product-cell">

                    ${escapeHtml(item.name)}

                    ${
                        best
                            ? `
                                <span class="badge">
                                    Best
                                </span>
                            `
                            : ""
                    }

                </td>

                <td class="unit-cell">
                    ${item.qty} ${item.unit}
                </td>

                <td class="num">
                    ${fmtMoney(item.price)}
                </td>

                <td class="num unit-cell">
                    ${fmtMoney(item.unitPrice)}
                    /${item.label}
                </td>

            </tr>

        `;

    }


    /* ---------------- RENDER ---------------- */

    function render() {

        const count = items.length;


        el.clear.style.display =
            count ? "block" : "none";


        el.headerCount.textContent =
            count
                ? `${count} option${count === 1 ? "" : "s"}`
                : "";


        /* EMPTY */

        if (!count) {

            el.results.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                        >

                            <path
                                d="M4 9L12 3L20 9V20C20 20.55 19.55 21 19 21H5C4.45 21 4 20.55 4 20V9Z"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M8 13H16M8 16H13"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                            />

                        </svg>

                    </div>

                    <div class="empty-title">
                        Nothing to compare yet
                    </div>

                    <div class="empty-text">
                        Add two or more products to find the best value.
                    </div>

                </div>

            `;

            el.tableSection.style.display =
                "none";

            return;

        }


        /* GROUP BY TYPE */

        const groups =
            new Map();


        items.forEach(item => {

            if (!groups.has(item.type)) {

                groups.set(
                    item.type,
                    []
                );

            }

            groups
                .get(item.type)
                .push(item);

        });


        let cards = "";

        let rows = "";


        const multipleTypes =
            groups.size > 1;


        TYPE_ORDER.forEach(type => {

            if (!groups.has(type))
                return;


            const group =
                groups
                    .get(type)
                    .slice()
                    .sort(
                        (a, b) =>
                            a.unitPrice -
                            b.unitPrice
                    );


            const best =
                group[0];

            const highest =
                group[group.length - 1]
                    .unitPrice;


            cards += `

                <section class="group">

                    ${
                        multipleTypes
                            ? `
                                <div class="group-label">
                                    ${TYPE_TITLE[type]}
                                </div>
                            `
                            : ""
                    }

            `;


            group.forEach(item => {

                cards += buildTicket(
                    item,
                    group.length > 1 &&
                    item.id === best.id,
                    highest
                );

            });


            if (group.length > 1) {

                const worst =
                    group[group.length - 1];

                const saving =
                    (
                        (worst.unitPrice -
                         best.unitPrice)
                        /
                        best.unitPrice
                    ) * 100;


                cards += `

                    <div class="savings">

                        ${escapeHtml(best.name)}
                        is the best value —
                        up to
                        <strong>
                            ${saving.toFixed(0)}% cheaper
                        </strong>
                        per ${best.label}.

                    </div>

                `;

            }


            cards += `
                </section>
            `;


            if (multipleTypes) {

                rows += `

                    <tr>

                        <td
                            colspan="5"
                            style="
                                padding:9px 12px 5px;
                                font-family:JetBrains Mono,monospace;
                                font-size:8px;
                                text-transform:uppercase;
                                letter-spacing:.08em;
                                color:#C7A936;
                                background:rgba(20,34,27,.035);
                            "
                        >
                            ${TYPE_TITLE[type]}
                        </td>

                    </tr>

                `;

            }


            group.forEach((item, index) => {

                rows += buildRow(
                    item,
                    index + 1,
                    group.length > 1 &&
                    item.id === best.id
                );

            });

        });


        el.results.innerHTML =
            cards;


        el.tableBody.innerHTML =
            rows;


        el.tableSection.style.display =
            count > 1
                ? "block"
                : "none";

    }


    /* ---------------- EVENTS ---------------- */

    el.add.addEventListener(
        "click",
        addItem
    );


    el.clear.addEventListener(
        "click",
        () => {

            items.length = 0;

            productCounter = 0;

            setDefaults();

            render();

        }
    );


    [
        el.name,
        el.qty,
        el.price
    ].forEach(input => {

        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    addItem();

                }

            }
        );

    });


    el.name.addEventListener(
        "focus",
        () => {

            el.name.select();

        }
    );


    /* ---------------- INIT ---------------- */

    setDefaults();

    render();

})();

</script>

</body>
</html>
